name: Build Desktop Apps (Tauri)

on:
  workflow_dispatch: # Allows you to manually click "Run workflow" to build them anytime!
  push:
    paths:
      - 'desktop-app/**'
      - 'frontend/**'

jobs:
  build-tauri:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'macos-latest'
            args: '--target universal-apple-darwin'
          - platform: 'ubuntu-22.04'
            args: ''
          - platform: 'windows-latest'
            args: ''

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Rust stable (macOS)
        shell: bash
        run: |
          rustup target add aarch64-apple-darwin x86_64-apple-darwin
        if: matrix.platform == 'macos-latest'

      - name: Install Rust stable (Linux/Windows)
        uses: actions-rust-lang/setup-rust-toolchain@v1
        if: matrix.platform != 'macos-latest'

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libwebkit2gtk-4.0-dev
        
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm install
        
      - name: Install desktop wrapper dependencies
        working-directory: desktop-app
        run: npm install
        
      - name: Build Tauri
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: desktop-app
          args: ${{ matrix.args }}
          
      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: NetGuard-Desktop-${{ matrix.platform }}
          path: |
            desktop-app/src-tauri/target/release/bundle/dmg/*.dmg
            desktop-app/src-tauri/target/release/bundle/appimage/*.AppImage
            desktop-app/src-tauri/target/release/bundle/deb/*.deb
            desktop-app/src-tauri/target/release/bundle/nsis/*.exe
          retention-days: 3