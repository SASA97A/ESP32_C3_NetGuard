name: Build and Release ESP32 Firmware

on:
  push:
    branches:
      - main
    paths:
      - 'src/**'
      - 'platformio.ini'
      - 'partitions.csv'

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Bump Version in main.cpp
        id: bump_version
        run: |
          CURRENT_VERSION=$(grep -oP 'FW_VERSION = "\K(v[0-9]+\.[0-9]+\.[0-9]+)' src/main.cpp)
          if [ -z "$CURRENT_VERSION" ]; then
            echo "Version string not found!"
            exit 1
          fi
          V_NUM=${CURRENT_VERSION#v}
          IFS='.' read -r major minor patch <<< "$V_NUM"
          NEW_PATCH=$((patch + 1))
          NEW_VERSION="v${major}.${minor}.${NEW_PATCH}"
          
          sed -i "s/$CURRENT_VERSION/$NEW_VERSION/" src/main.cpp
          
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add src/main.cpp
          git commit -m "chore: bump firmware version to $NEW_VERSION [skip ci]"
          git push
          
          echo "NEW_VERSION=$NEW_VERSION" >> $GITHUB_ENV

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install PlatformIO
        run: |
          python -m pip install --upgrade pip
          pip install platformio

      - name: Prepare Secrets
        run: cp src/secrets.example.h src/secrets.h

      - name: Build Firmware
        run: pio run -e c3

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.NEW_VERSION }}
          name: Firmware Release ${{ env.NEW_VERSION }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: .pio/build/c3/firmware.bin
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
