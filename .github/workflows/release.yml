name: Unified Build and Release

on:
  push:
    branches:
      - main
    paths:
      - 'src/**'
      - 'platformio.ini'
      - 'partitions.csv'
      - 'frontend/**'
      - 'desktop-app/**'

permissions:
  contents: write

jobs:
  firmware:
    runs-on: ubuntu-latest
    outputs:
      new_version: ${{ steps.bump_version.outputs.NEW_VERSION }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Bump Version in main.cpp
        id: bump_version
        run: |
          CURRENT_VERSION=$(grep -oP 'FW_VERSION = "\K(v[0-9]+\.[0-9]+\.[0-9]+)' src/main.cpp)
          if [ -z "$CURRENT_VERSION" ]; then
            echo "Version string not found!"
            exit 1
          fi
          V_NUM=${CURRENT_VERSION#v}
          IFS='.' read -r major minor patch <<< "$V_NUM"
          NEW_PATCH=$((patch + 1))
          NEW_VERSION="v${major}.${minor}.${NEW_PATCH}"
          
          sed -i "s/$CURRENT_VERSION/$NEW_VERSION/" src/main.cpp
          
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add src/main.cpp
          git commit -m "chore: bump firmware version to $NEW_VERSION [skip ci]"
          git push
          
          echo "NEW_VERSION=$NEW_VERSION" >> $GITHUB_ENV
          echo "NEW_VERSION=$NEW_VERSION" >> $GITHUB_OUTPUT

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install PlatformIO
        run: |
          python -m pip install --upgrade pip
          pip install platformio

      - name: Prepare Secrets
        run: cp src/secrets.example.h src/secrets.h

      - name: Build Firmware
        run: pio run -e c3

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.NEW_VERSION }}
          name: Release ${{ env.NEW_VERSION }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: .pio/build/c3/firmware.bin
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  desktop:
    needs: firmware
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'macos-latest'
            args: '--target universal-apple-darwin'
          - platform: 'ubuntu-22.04'
            args: ''
          - platform: 'windows-latest'
            args: ''
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Rust stable (macOS)
        shell: bash
        run: |
          rustup target add aarch64-apple-darwin x86_64-apple-darwin
        if: matrix.platform == 'macos-latest'

      - name: Install Rust stable (Linux/Windows)
        uses: actions-rust-lang/setup-rust-toolchain@v1
        if: matrix.platform != 'macos-latest'

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libwebkit2gtk-4.0-dev
        
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm install
        
      - name: Install desktop wrapper dependencies
        working-directory: desktop-app
        run: npm install
        
      - name: Build Tauri
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: desktop-app
          args: ${{ matrix.args }}

      - name: Upload to Multi-Platform GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.firmware.outputs.new_version }}
          files: |
            desktop-app/src-tauri/target/**/bundle/dmg/*.dmg
            desktop-app/src-tauri/target/**/bundle/appimage/*.AppImage
            desktop-app/src-tauri/target/**/bundle/deb/*.deb
            desktop-app/src-tauri/target/**/bundle/nsis/*.exe